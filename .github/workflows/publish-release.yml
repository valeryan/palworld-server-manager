name: Publish release

# Runs when a release pull request (head branch release/*, opened by Prepare release) is merged,
# and for no other reason. It tags the merge commit, creates the GitHub release with GitHub's
# generated notes, and uploads the release files. The files come from the Build release that the
# pull request checks ran on the release branch whenever the merged tree is identical to that
# branch; only when something else landed in between is the build repeated. To finish a release
# that failed partway, use "Re-run failed jobs" on its run: every step reuses what already exists.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Decide whether to publish
    if: ${{ github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ github.event.pull_request.merge_commit_sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      previous-tag: ${{ steps.check.outputs.previous-tag }}
      reuse-run: ${{ steps.reuse.outputs.reuse-run }}
    steps:
      - name: Check out the merge commit with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the version against the release tags
        id: check
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version^{commit}" >/dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t tags < <(git tag -l 'v*')
          npx tsx scripts/release/prepare.ts check "$version" - "${tags[@]}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version from $SHA (pull request #$NUMBER)"

      # The pull request checks ran Build release on the release branch. When the merge produced
      # exactly that tree, those files are the release; otherwise the build runs again below.
      - name: Look for the files built on the pull request
        id: reuse
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: release-${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          reuse=""
          git fetch -q origin "refs/pull/$NUMBER/head"
          if [[ "$(git rev-parse "$HEAD^{tree}")" != "$(git rev-parse "$SHA^{tree}")" ]]; then
            echo "The merge commit's tree differs from the pull request head ($HEAD); something else merged in between. Building again."
          else
            run="$(gh run list --workflow pull-request.yml --commit "$HEAD" --status success --json databaseId --jq '.[0].databaseId // ""')"
            if [[ -z "$run" ]]; then
              echo "No successful pull request checks run for $HEAD. Building again."
            else
              found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq "[.artifacts[] | select((.name == \"$PREFIX-linux\" or .name == \"$PREFIX-windows\") and .expired == false) | .name] | unique | length")"
              if [[ "$found" == "2" ]]; then
                reuse="$run"
                echo "Reusing $PREFIX-linux and $PREFIX-windows from run $run: the pull request built this exact tree."
              else
                echo "Run $run does not hold both $PREFIX-linux and $PREFIX-windows. Building again."
              fi
            fi
          fi
          echo "reuse-run=$reuse" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.publish == 'true' && needs.check.outputs.reuse-run == ''
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  publish:
    name: Publish the release
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.publish == 'true' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.check.outputs.reuse-run != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      # Both platform artifacts land in their own folder; each carries its SHA256SUMS.txt.
      - name: Download the files built on the pull request
        if: needs.check.outputs.reuse-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.check.outputs.version }}-*
          path: release
          run-id: ${{ needs.check.outputs.reuse-run }}
          github-token: ${{ github.token }}

      - name: Download the files built in this run
        if: needs.check.outputs.reuse-run == ''
        uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.check.outputs.version }}-*
          path: release

      # Each step below can run again: a re-run finishes a release that stopped partway.
      - name: Resolve and push the tag
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -n "$existing" && "$existing" != "$SHA" ]]; then
            echo "::error::Tag $tag already points to $existing instead of $SHA."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$SHA"
            git push origin "$tag"
          else
            echo "Tag already identifies the release commit: $tag"
          fi

      - name: Create or reuse the GitHub release
        id: release
        uses: actions/github-script@v9
        env:
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          PREVIOUS: ${{ needs.check.outputs.previous-tag }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const prerelease = process.env.PRERELEASE === "true";
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag })).data;
              core.info(`Reusing ${release.html_url}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const notes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner, repo: context.repo.repo, tag_name: tag,
                ...(process.env.PREVIOUS ? { previous_tag_name: process.env.PREVIOUS } : {}),
              });
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, name: tag,
                prerelease, make_latest: prerelease ? "false" : "true",
                body: notes.data.body,
              })).data;
              core.info(`Created ${release.html_url}`);
            }
            core.setOutput("url", release.html_url);

      # The release holds the AppImage and the two Windows exes; GitHub adds the source archives
      # and shows each file's SHA-256, so SHA256SUMS.txt stays in the artifact and run summary.
      - name: Upload the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" release/*/*.AppImage release/*/*.exe --clobber

      - name: Remove the release branch
        run: git push origin --delete "release/v$VERSION" 2>/dev/null || echo "No release/v$VERSION branch to delete."

      - name: Summarize
        env:
          URL: ${{ steps.release.outputs.url }}
          REUSED: ${{ needs.check.outputs.reuse-run }}
        run: |
          {
            echo "### Release v$VERSION"
            echo "[$URL]($URL)"
            echo
            if [[ -n "$REUSED" ]]; then echo "Files reused from pull request run $REUSED."; else echo "Files built in this run."; fi
            echo
            cat release/*/SHA256SUMS.txt | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
