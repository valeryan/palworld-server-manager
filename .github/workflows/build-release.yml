name: Build release

# Checks and builds the release files for one ref. Two jobs run side by side: `verify` runs the
# checks and the browser and packaged-Electron workflows, `package` builds the Linux AppImage and
# the Windows Setup and portable exes. The Windows exes are then exercised on Windows runners, one
# per flavor. Run it by hand on any branch to get the files as workflow artifacts without
# publishing; the pull request checks call it for release branches and Publish release reuses
# what they built. Nothing here touches main, tags, or releases.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build (empty = the branch you run it on)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        required: true
        type: string
    outputs:
      version:
        description: "Version in package.json at the built ref"
        value: ${{ jobs.package.outputs.version }}
      artifact:
        description: "Name of the workflow artifact holding the release files"
        value: ${{ jobs.package.outputs.artifact }}

concurrency:
  group: build-release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REF: ${{ inputs.ref || github.sha }}

jobs:
  verify:
    name: Checks and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Restore Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore electron-builder's downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser dependencies
        run: npx playwright install --with-deps --only-shell chromium

      # Cheapest checks first, so a failure shows within a minute or two.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check import cycles
        run: npm run check:cycles

      - name: Run unit tests
        run: npm test

      - name: Build and prepare an unpacked app for the workflows
        run: npm run pack

      - name: Run browser and packaged-Electron workflows
        run: xvfb-run -a npx playwright test

      - name: Upload workflow diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build the release files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Check out the ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "Building $version from $(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=release-$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Restore electron-builder's downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The Windows installer is cross-built here; electron-builder runs it under Wine to
      # extract the uninstaller. The NSIS stub is 32-bit, so 32-bit Wine is needed too. On
      # Ubuntu 24.04 the `wine` command itself comes from the `wine` package (wine64 only ships
      # /usr/lib/wine/wine64), and it is not pulled in without recommends, so it is named here.
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386
          wine --version

      - name: Build
        run: npm run release

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            release/*.AppImage
            release/*-Setup-*.exe
            release/*-Portable-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows-runtime:
    name: Test the Windows ${{ matrix.flavor }} exe
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [Portable, Setup]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release
      - name: Install artifact harness only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifact-harness | Out-Null
          Copy-Item e2e/windows/artifacts.mjs .artifact-harness/windows.mjs
          npm install --prefix .artifact-harness --no-audit --no-fund playwright@1.63.0
      - name: Exercise the ${{ matrix.flavor }} exe
        run: node .artifact-harness/windows.mjs release windows-artifact-results ${{ matrix.flavor }}
      - name: Preserve native runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-${{ needs.package.outputs.version }}-${{ matrix.flavor }}
          path: windows-artifact-results/
          if-no-files-found: warn
