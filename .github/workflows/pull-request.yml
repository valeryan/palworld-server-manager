name: Pull request checks

# Ordinary pull requests get the source checks and the browser workflow. A release pull request
# (head branch release/*, opened by Prepare release) gets the full Build release instead: every
# check, the packaged artifacts, and the Windows runtime test, so a release is proven before it is
# merged and Publish release can reuse the files it built.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check import cycles
        run: npm run check:cycles

      - name: Run unit tests
        run: npm test

      - name: Build Electron launcher
        run: npm run build:electron

  browser:
    name: Browser workflow
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Restore Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run isolated browser workflow
        run: npm run test:e2e:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Release build
    if: ${{ startsWith(github.head_ref, 'release/') }}
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
