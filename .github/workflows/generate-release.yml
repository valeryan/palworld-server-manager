name: Generate release

# Cuts a release from main: checks the version, writes the release commit (version, lock file,
# changelog from GitHub's generated notes), builds the Linux AppImage and the Windows Setup and
# portable exes from that commit, then moves main to it, tags it, and publishes the GitHub release.
# Nothing reaches main, tags, or releases until both artifacts are built and verified.
# A dry run builds everything and keeps the files as workflow artifacts, publishing nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (for example 1.0.0-alpha.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as a prerelease (required for versions with a label such as -alpha.3)"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Dry run: build and keep the artifacts, but change nothing on GitHub"
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  BRANCH: release/v${{ inputs.version }}

jobs:
  prepare:
    name: Prepare the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      previous-tag: ${{ steps.check.outputs.previous-tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main; this ran on ${{ github.ref }}."
          exit 1

      - name: Check out main with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the version
        id: check
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag -l 'v*')
          previous="$(npx tsx scripts/release/prepare.ts check "$VERSION" "${{ inputs.prerelease }}" "${tags[@]}")"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists from an earlier run. Finish that release by re-running its failed jobs, or delete the branch."
            exit 1
          fi
          echo "previous-tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.check.outputs.previous-tag }}
        run: |
          set -euo pipefail
          args=(-f "tag_name=v$VERSION" -f "target_commitish=main")
          if [[ -n "$PREVIOUS" ]]; then args+=(-f "previous_tag_name=$PREVIOUS"); fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${args[@]}" --jq .body > release-notes.md
          cat release-notes.md

      - name: Write the release commit
        id: commit
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npx tsx scripts/release/prepare.ts changelog "$VERSION" "$(date -u +%Y-%m-%d)" release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Verify and build the artifacts
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps --only-shell chromium

      # The Windows installer is cross-built here; electron-builder runs it under Wine to
      # extract the uninstaller. The NSIS stub is 32-bit, so 32-bit Wine is needed too.
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 wine32:i386

      - name: Verify and build
        run: xvfb-run -a npm run release

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.version }}
          path: |
            release/*.AppImage
            release/*-Setup-*.exe
            release/*-Portable-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.version }}
          path: release

      # Each step below can run again: a re-run finishes a release that stopped partway.
      - name: Move main to the release commit
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" == "$SHA" ]]; then
            echo "main already points at the release commit."
          elif git merge-base --is-ancestor origin/main "$SHA"; then
            git push origin "$SHA:refs/heads/main"
          else
            echo "::error::main moved while the release was building. Nothing was published; run the release again."
            exit 1
          fi

      - name: Resolve and push the tag
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -n "$existing" && "$existing" != "$SHA" ]]; then
            echo "::error::Tag $tag already points to $existing instead of $SHA."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$SHA"
            git push origin "$tag"
          else
            echo "Tag already identifies the release commit: $tag"
          fi

      - name: Create or reuse the GitHub release
        id: release
        uses: actions/github-script@v9
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          PREVIOUS: ${{ needs.prepare.outputs.previous-tag }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const prerelease = process.env.PRERELEASE === "true";
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag })).data;
              core.info(`Reusing ${release.html_url}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const notes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner, repo: context.repo.repo, tag_name: tag,
                ...(process.env.PREVIOUS ? { previous_tag_name: process.env.PREVIOUS } : {}),
              });
              const windows = "> **Windows (Setup and Portable):** test builds, not yet validated on Windows. The Linux AppImage is the supported artifact. The portable exe keeps its data in a PSM-Data folder beside it and is updated by downloading a new release.";
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, name: tag,
                prerelease, make_latest: prerelease ? "false" : "true",
                body: `${windows}\n\n${notes.data.body}\n\nRelease created by @${context.actor}`,
              })).data;
              core.info(`Created ${release.html_url}`);
            }
            core.setOutput("url", release.html_url);

      # The release holds the AppImage and the two Windows exes; GitHub adds the source archives
      # and shows each file's SHA-256, so SHA256SUMS.txt stays in the artifact and run summary.
      - name: Upload the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" release/*.AppImage release/*.exe --clobber

      - name: Summarize
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "### Release v$VERSION"
            echo "[$URL]($URL)"
            echo
            sed 's/^/    /' release/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove the release branch
    needs: [prepare, build, publish]
    if: ${{ always() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Kept only when main already moved to the release commit but publishing did not finish,
      # so "Re-run failed jobs" can complete it. Otherwise main and the tags are untouched.
      - name: Delete the branch unless a release is half published
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ -n "$SHA" && "$PUBLISHED" != "success" && "$(git rev-parse origin/main)" == "$SHA" ]]; then
            echo "::warning::main points at the release commit but publishing did not finish; keeping $BRANCH. Re-run the failed jobs."
            exit 0
          fi
          git push origin --delete "$BRANCH" 2>/dev/null || echo "No $BRANCH to delete."
